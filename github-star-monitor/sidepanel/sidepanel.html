<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <div id="app">
    <header class="header">
      <h1 class="title">GitHub Star Monitor</h1>
      <span class="status-dot" id="statusDot"></span>
    </header>

    <section class="auth-section" id="authSection">
      <div class="auth-connected" id="authConnected" style="display:none">
        <span class="connected-icon">&#9679;</span>
        <span id="authUser">已连接</span>
      </div>
      <div class="auth-config" id="authConfig" style="display:none">
        <div class="config-hint">
          需要 <strong>GitHub OAuth App</strong> 凭证才能连接：
          <ol>
            <li>创建 OAuth App：<a href="https://github.com/settings/developers" target="_blank">github.com/settings/developers</a></li>
            <li>回调地址填：<code id="redirectUri">chrome.identity.getRedirectURL</code></li>
            <li>填入下方 Client ID 和 Secret</li>
          </ol>
        </div>
        <label class="config-label">Client ID</label>
        <input class="config-input" type="text" id="clientIdInput" placeholder="Ov23li...">
        <label class="config-label">Client Secret</label>
        <input class="config-input" type="password" id="clientSecretInput" placeholder="ghs_...">
        <div class="config-actions">
          <button class="config-save-btn" id="configSaveBtn">保存凭证</button>
        </div>
        <div class="config-status" id="configStatus"></div>
      </div>
      <button class="auth-btn" id="authBtn" style="display:none">连接 GitHub 账号</button>
    </section>

    <section class="actions">
      <button class="check-btn" id="checkBtn">
        &#x21bb; 手动检查更新
      </button>
      <div class="check-status" id="checkStatus">
        <span id="checkTime">上次检查: --</span>
        <span id="checkResult"></span>
      </div>
    </section>

    <section class="updates-section">
      <div class="list-toolbar">
        <input class="search-input" type="text" id="searchInput" placeholder="搜索仓库名...">
        <select class="sort-select" id="sortSelect">
          <option value="newest">更新: 新→旧</option>
          <option value="oldest">更新: 旧→新</option>
          <option value="az">名称: A→Z</option>
          <option value="za">名称: Z→A</option>
          <option value="stars-desc">标星: 多→少</option>
          <option value="stars-asc">标星: 少→多</option>
        </select>
      </div>
      <div class="update-list" id="updateList">
        <div class="empty-state" id="emptyState">
          &#x1f7e2; 暂无更新
        </div>
        <div class="error-state" id="errorState" style="display:none">
          &#x26a0; 网络连接失败，请检查代理后重试
        </div>
        <div class="error-state" id="noTokenState" style="display:none">
          &#x1f511; 请先连接 GitHub 账号
        </div>
      </div>
    </section>

    <footer class="footer">
      <button class="logout-btn" id="logoutBtn" style="display:none">退出登录</button>
    </footer>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
